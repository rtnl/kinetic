name: build clang linux

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: install clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang

      - name: build script
        run: |
          ./build/build.sh

      - name: upload test
        uses: actions/upload-artifact@v7
        with:
          name: libkinetic_test
          path: ./build/kinetic_test
